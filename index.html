<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Трекер контента для астрологов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --cream:#F9EFF1; --card:#FFFFFF; --navy:#2A1B45; --gold:#C9A96E;
    --gold-light:#E7D9B8; --gold-deep:#9C7F49; --ink:#20222E; --body:#585A68;
    --line:rgba(23,26,51,0.10); --blush:#F3DCD2; --lavender:#E1D8ED;
    --sage:#DCE6D6; --sky:#D5E3EC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5;
  }
  .page{
    max-width:520px;margin:0 auto;
    padding:26px 18px calc(40px + env(safe-area-inset-bottom));
    position:relative;overflow:hidden;min-height:100vh;
  }
  .glow{position:absolute;border-radius:50%;filter:blur(80px);z-index:0;opacity:.45;pointer-events:none;}
  .g1{width:280px;height:280px;background:var(--blush);top:-150px;left:-120px;}
  .g2{width:260px;height:260px;background:var(--lavender);top:-130px;right:-110px;}
  .g3{width:200px;height:200px;background:var(--sky);top:180px;right:-130px;opacity:.35;}
  .g4{width:200px;height:200px;background:var(--sage);top:420px;left:-120px;opacity:.3;}
  .page > *:not(.glow){position:relative;z-index:1;}

  .eyebrow{
    display:flex;align-items:center;justify-content:center;gap:10px;
    text-transform:uppercase;letter-spacing:3px;font-size:10px;
    color:var(--gold-deep);font-weight:600;margin-bottom:14px;
  }
  .eyebrow .line{width:28px;height:1px;background:var(--gold);}
  h1.title{
    font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:36px;
    line-height:1.1;text-align:center;color:var(--navy);margin:0 0 10px;
  }
  h1.title em{font-style:italic;color:var(--gold-deep);}
  .subtitle{text-align:center;color:var(--body);font-size:13.5px;margin:0 auto 26px;line-height:1.6;max-width:340px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-bottom:14px;}
  .card-label{text-transform:uppercase;letter-spacing:2.2px;font-size:10px;color:var(--gold-deep);font-weight:700;margin-bottom:12px;}
  .muted{color:var(--body);font-size:13.5px;line-height:1.6;margin:0;}

  .prog-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;gap:10px;}
  .prog-day{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;color:var(--navy);font-weight:600;}
  .prog-day span{font-size:15px;color:var(--body);font-family:'Inter',sans-serif;font-weight:500;}
  .prog-streak{font-size:12px;color:var(--gold-deep);font-weight:600;text-align:right;}
  .theme-line{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:16px;color:var(--gold-deep);margin:0 0 16px;}
  .dots{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;}
  .dot{
    aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--cream);
    display:flex;align-items:center;justify-content:center;font-size:9px;color:#B9B4C2;
    font-weight:600;transition:transform .15s ease;
  }
  .dot.done{background:var(--navy);border-color:var(--navy);color:var(--gold-light);cursor:pointer;}
  .dot.done.shot{box-shadow:0 0 0 2px rgba(201,169,110,.55);}
  .dot.today{border:1.5px solid var(--gold);color:var(--gold-deep);background:#fff;}
  .dot.done:active{transform:scale(.9);}

  .idea-card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:14px;}
  .idea-head{background:var(--navy);padding:16px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .idea-head .tag{
    display:inline-flex;align-items:center;gap:6px;background:rgba(201,169,110,.16);
    border:1px solid rgba(201,169,110,.4);color:var(--gold-light);font-size:10px;
    letter-spacing:2px;text-transform:uppercase;padding:5px 11px;border-radius:100px;white-space:nowrap;
  }
  .idea-head .daynum{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:14px;color:rgba(255,255,255,.75);}
  .idea-body{padding:20px;}
  .idea-title{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:24px;color:var(--navy);margin:0 0 10px;line-height:1.2;}
  .idea-hint{color:var(--body);font-size:14px;line-height:1.65;margin:0;}

  .btn{
    display:block;width:100%;border:none;border-radius:100px;padding:16px 20px;
    font-family:'Inter',sans-serif;font-size:15px;font-weight:600;background:var(--navy);
    color:#fff;cursor:pointer;transition:opacity .15s ease,transform .15s ease;
  }
  .btn:active{transform:scale(.985);}
  .btn.gold{background:var(--gold-deep);}
  .btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn.sm{padding:12px 18px;font-size:13.5px;}
  .btn:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px;}
  .btn-note{text-align:center;font-size:11.5px;color:var(--body);margin:9px 0 0;}
  .done-state{text-align:center;background:var(--cream);border-radius:18px;padding:16px;}
  .done-state .mark{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;color:var(--navy);font-style:italic;}
  .done-state .sub{font-size:12px;color:var(--gold-deep);font-weight:600;margin-top:4px;}
  .thumb-preview{width:100%;border-radius:14px;margin-top:12px;display:block;cursor:pointer;}

  details.pointa{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:14px;}
  details.pointa summary{list-style:none;padding:18px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  details.pointa summary::-webkit-details-marker{display:none;}
  .pa-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;color:var(--navy);font-weight:600;}
  .pa-chev{font-size:11px;color:var(--gold-deep);letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}
  .pa-body{padding:0 20px 20px;}
  .pa-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);}
  .pa-row:last-child{border-bottom:none;}
  .pa-row .k{font-size:13px;color:var(--body);flex:1;}
  .pa-row .v{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:16px;color:var(--gold-deep);text-align:right;}

  .reward{border-radius:22px;padding:22px 20px;margin-bottom:14px;background:var(--card);border:1px dashed var(--gold);text-align:center;}
  .reward.on{background:var(--navy);border:1px solid var(--navy);}
  .reward .star{font-size:15px;color:var(--gold);letter-spacing:6px;}
  .reward h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:23px;color:var(--navy);margin:8px 0;}
  .reward.on h3{color:#fff;}
  .reward p{font-size:13px;color:var(--body);line-height:1.6;margin:0;}
  .reward.on p{color:rgba(255,255,255,.78);}
  .reward .bar{height:5px;border-radius:100px;background:var(--cream);margin-top:16px;overflow:hidden;}
  .reward .bar i{display:block;height:100%;background:var(--gold);border-radius:100px;transition:width .4s ease;}
  .reward.on .bar{background:rgba(255,255,255,.15);}

  .theme-opt{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:11px;cursor:pointer;transition:border-color .15s ease;}
  .theme-opt.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .theme-opt h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:21px;color:var(--navy);margin:0 0 6px;}
  .theme-opt p{font-size:13px;color:var(--body);line-height:1.55;margin:0;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;color:var(--body);margin-bottom:6px;}
  .field input{
    width:100%;border:1px solid var(--line);border-radius:14px;background:var(--cream);
    padding:13px 15px;font-family:'Inter',sans-serif;font-size:16px;color:var(--ink);
  }
  .field input:focus{outline:none;border-color:var(--gold);background:#fff;}

  .rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
  .rep-item{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  .rep-item img{width:100%;height:120px;object-fit:cover;display:block;background:var(--cream);cursor:pointer;}
  .rep-item .noimg{height:120px;display:flex;align-items:center;justify-content:center;background:var(--cream);color:#B9B4C2;font-size:11px;text-align:center;padding:10px;}
  .rep-item .meta{padding:9px 11px;}
  .rep-item .d{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px;color:var(--gold-deep);}
  .rep-item .t{font-size:11px;color:var(--body);line-height:1.35;margin-top:2px;}

  .foot{text-align:center;margin-top:26px;}
  .foot .mark{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:14px;color:var(--gold-deep);}
  .devbar{margin-top:18px;display:flex;gap:8px;}
  .devbar button{flex:1;background:transparent;border:1px dashed var(--line);border-radius:100px;padding:9px;font-size:11px;color:#A8A4B2;font-family:'Inter',sans-serif;cursor:pointer;}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--navy);color:#fff;padding:12px 20px;border-radius:100px;font-size:13px;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .lightbox{position:fixed;inset:0;background:rgba(32,34,46,.9);display:none;align-items:center;justify-content:center;padding:24px;z-index:60;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:80vh;border-radius:16px;}
  .hidden{display:none !important;}

  .author-row{
    display:flex;align-items:center;justify-content:center;gap:12px;
    margin:0 0 22px;
  }
  .author-photo{
    width:52px;height:52px;border-radius:50%;object-fit:cover;
    border:2px solid var(--gold-light);flex:none;
  }
  .author-photo.placeholder{
    background:var(--cream);border:2px dashed var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;
    font-size:20px;color:var(--gold-deep);
  }
  .author-text{text-align:left;}
  .author-name{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:16px;color:var(--navy);line-height:1.2;}
  .author-link{font-size:12px;color:var(--gold-deep);text-decoration:none;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="page">
  <div class="glow g1"></div><div class="glow g2"></div>

  <div id="root"></div>

    <div class="mark">✷ Кристина Бегашева</div>

</div>

<script>
(function(){
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

  var STORE = "kb_content_tracker_v2";
  var DATA = null, OFFLINE = false;
  var S = load();
  var root = document.getElementById("root");

  function blank(){ return { themeId:null, startDate:null, pointA:{}, pointB:{}, days:{}, offset:0 }; }
  function load(){ try { return JSON.parse(localStorage.getItem(STORE)) || blank(); } catch(e){ return blank(); } }
  function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); return true; } catch(e){ return false; } }

  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._x); t._x = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function fmt(iso){
    var d = new Date(iso);
    var m = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
    return d.getDate() + " " + m[d.getMonth()];
  }
  function total(){ return (DATA && DATA.challenge && DATA.challenge.totalDays) || 30; }
  function currentDay(){
    if (!S.startDate) return 1;
    var n = Math.floor((today() - new Date(S.startDate)) / 86400000) + 1 + (S.offset || 0);
    return Math.max(1, Math.min(total(), n));
  }
  function theme(){
    if (!DATA) return null;
    for (var i=0;i<DATA.themes.length;i++) if (DATA.themes[i].id === S.themeId) return DATA.themes[i];
    return null;
  }
  function ideaFor(day){
    var t = theme(); if (!t || !t.ideas.length) return null;
    return t.ideas[(day - 1) % t.ideas.length];
  }
  function doneCount(){ return Object.keys(S.days).length; }
  function plural(n,a,b,c){
    var m = n % 100; if (m > 4 && m < 20) return c;
    m = n % 10; if (m === 1) return a; if (m > 1 && m < 5) return b; return c;
  }
  function num(v){
    if (v === undefined || v === null || v === "") return null;
    var n = parseFloat(String(v).replace(/[^\d.,-]/g,"").replace(",","."));
    return isNaN(n) ? null : n;
  }
  function fmtn(n){ return n === null ? "—" : n.toLocaleString("ru-RU"); }
  function delta(a,b){
    if (a === null || b === null) return "";
    var d = b - a;
    if (d === 0) return ' <span style="color:var(--body);font-size:12px">без изменений</span>';
    var col = d > 0 ? "var(--gold-deep)" : "var(--body)";
    return ' <span style="color:' + col + ';font-size:12px">' + (d > 0 ? "+" : "−") + Math.abs(d).toLocaleString("ru-RU") + '</span>';
  }
  function authorHtml(){
    var c = DATA.challenge;
    if (!c.author) return "";
    var photo = c.authorPhoto
      ? '<img class="author-photo" src="' + esc(c.authorPhoto) + '" alt="' + esc(c.author) + '">'
      : '<div class="author-photo placeholder">' + esc((c.author || "?").trim().charAt(0)) + '</div>';
    var link = c.channelUrl
      ? '<a class="author-link" href="' + esc(c.channelUrl) + '" target="_blank" rel="noopener">' + esc(c.channelLabel || c.channelUrl) + '</a>'
      : "";
    return '<div class="author-row">' + photo +
           '<div class="author-text"><div class="author-name">' + esc(c.author) + '</div>' + link + '</div></div>';
  }
  function inputAttrs(f){
    var isNum = f.type === "number";
    return ' type="' + (isNum ? "number" : "text") + '" inputmode="' + (isNum ? "numeric" : "text") + '"';
  }

  /* ---------- данные ---------- */
  fetch("data.json?v=" + Date.now(), { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })

    .catch(function(){
      try {
        DATA = JSON.parse(document.getElementById("fallback-data").textContent);
        OFFLINE = true; render();
      } catch(e){ renderError(); }
    });

  function renderError(){
    root.innerHTML =
      '<div class="eyebrow"><span class="line"></span><span>трекер контента</span><span class="line"></span></div>' +
      '<h1 class="title">Данные <em>не загрузились</em></h1>' +
      '<p class="subtitle">Файл data.json не открылся. Проверь, что он лежит рядом с index.html, и обнови экран.</p>' +
      '<button class="btn" id="retry">Обновить</button>';
    document.getElementById("retry").onclick = function(){ location.reload(); };
  }

  /* ---------- экраны ---------- */
  function render(){
    var note = document.getElementById("offline-note");
    if (note) note.textContent = OFFLINE ? "данные встроены в файл · data.json не подключён" : "";

    renderMain();
  }

  function renderOnboarding(){
    var sel = S._draftTheme || null;
    var h = '<div class="eyebrow"><span class="line"></span><span>30 дней</span><span class="line"></span></div>' +
      '<h1 class="title">' + esc(DATA.challenge.title) + ' <em>' + esc(DATA.challenge.titleEm || "") + '</em></h1>' +
      '<p class="subtitle">' + esc(DATA.challenge.subtitle) + '</p>' +
      authorHtml() +
      '<div class="card"><div class="card-label">Шаг 1 · Точка А</div>' +
      '<p class="muted" style="margin-bottom:16px">' + esc(DATA.pointA.note) + '</p>';
    DATA.pointA.fields.forEach(function(f){
      h += '<div class="field"><label for="pa-' + esc(f.id) + '">' + esc(f.label) + '</label>' +
           '<input id="pa-' + esc(f.id) + '" data-pa="' + esc(f.id) + '"' + inputAttrs(f) +
           ' placeholder="' + esc(f.placeholder) + '"></div>';
    });
    h += '</div><div class="card-label" style="text-align:center;margin:24px 0 12px">Шаг 2 · Тема месяца</div>';
    DATA.themes.forEach(function(t){
      h += '<div class="theme-opt' + (sel === t.id ? ' sel' : '') + '" data-theme="' + esc(t.id) + '">' +
             '<h3>' + esc(t.name) + '</h3><p>' + esc(t.tagline) + '</p></div>';
    });
    h += '<button class="btn" id="start" style="margin-top:18px">Начать 30 дней</button>' +
         '<p class="btn-note">Отсчёт пойдёт с сегодняшнего дня. Тему потом можно сменить.</p>';
    root.innerHTML = h;

    Array.prototype.forEach.call(root.querySelectorAll("[data-theme]"), function(el){
      el.onclick = function(){
        var vals = {};
        Array.prototype.forEach.call(root.querySelectorAll("[data-pa]"), function(i){ vals[i.getAttribute("data-pa")] = i.value; });
        S._draftTheme = el.getAttribute("data-theme");
        renderOnboarding();
        Array.prototype.forEach.call(root.querySelectorAll("[data-pa]"), function(i){ i.value = vals[i.getAttribute("data-pa")] || ""; });
        var sc = root.querySelector(".theme-opt.sel");
        if (sc) sc.scrollIntoView({ block:"center", behavior:"smooth" });
      };
    });
    document.getElementById("start").onclick = function(){
      if (!S._draftTheme) return toast("Выбери тему месяца");
      var pa = {};
      Array.prototype.forEach.call(root.querySelectorAll("[data-pa]"), function(i){
        if (i.value.trim()) pa[i.getAttribute("data-pa")] = i.value.trim();
      });
      S.themeId = S._draftTheme; delete S._draftTheme;
      S.pointA = pa; S.startDate = today().toISOString();
      save(); window.scrollTo(0,0); render();
    };
  }

  function renderMain(){
    var t = theme(), day = currentDay(), n = doneCount(), tot = total();
    var rec = S.days[day], idea = ideaFor(day), complete = n >= tot;

    var h = '<div class="eyebrow"><span class="line"></span><span>трекер контента</span><span class="line"></span></div>';

    h += '<div class="card"><div class="prog-top">' +
      '<div class="prog-day">День ' + day + ' <span>из ' + tot + '</span></div>' +
      '<div class="prog-streak">' + n + ' ' + plural(n,"день","дня","дней") + ' закрыто</div></div>' +
      '<p class="theme-line">' + esc(t ? t.name : "") + '</p><div class="dots">';
    for (var i=1;i<=tot;i++){
      var d = S.days[i];
      h += '<div class="dot' + (d ? " done" : "") + (d && d.shot ? " shot" : "") +
           (i === day && !d ? " today" : "") + '" data-day="' + i + '">' + (d ? "✦" : i) + '</div>';
    }
    h += '</div></div>';

    if (idea){
      h += '<div class="idea-card"><div class="idea-head">' +
             '<span class="tag">' + esc(idea.format) + '</span>' +
             '<span class="daynum">' + esc(idea.stage || ("идея дня " + day)) + '</span></div><div class="idea-body">' +
             '<h3 class="idea-title">' + esc(idea.title) + '</h3>' +
             '<p class="idea-hint">' + esc(idea.hint) + '</p>' +
             '<p style="font-size:11px;color:#A8A4B2;margin:12px 0 0;letter-spacing:.5px">День ' + day + ' из ' + tot + ' · этап «' + esc(idea.stage || "") + '»</p>';
      if (rec){
        h += '<div class="done-state" style="margin-top:16px"><div class="mark">Выпущено ✦</div>' +
             '<div class="sub">' + fmt(rec.date) + (rec.shot ? " · скрин сохранён" : " · без скрина") + '</div>' +
             (rec.shot ? '<img class="thumb-preview" src="' + rec.shot + '" alt="Скрин публикации" data-full="' + day + '">' : "") +
             '</div>' + (rec.shot ? "" : '<button class="btn ghost sm" id="addshot" style="margin-top:12px">Добавить скрин</button>');
      } else {
        h += '<button class="btn" id="publish" style="margin-top:18px">Выпустила · приложить скрин</button>' +
             '<button class="btn ghost sm" id="publish-noshot" style="margin-top:9px">Отметить без скрина</button>' +
             '<p class="btn-note">Скрин нужен для соляра: по нему видно, в какой день что вышло.</p>';
      }
      h += '</div></div>';
    }

    var rw = DATA.challenge.reward;
    h += '<div class="reward' + (complete ? " on" : "") + '"><div class="star">✦ ✦ ✦</div>' +
         '<h3>' + esc(rw.title) + '</h3><p>' + esc(complete ? rw.unlocked : rw.locked) + '</p>' +
         '<div class="bar"><i style="width:' + Math.round(n / tot * 100) + '%"></i></div></div>';

    if (Object.keys(S.pointA).length){
      h += '<details class="pointa"><summary><span class="pa-title">Точка А</span>' +
           '<span class="pa-chev">' + fmt(S.startDate) + '</span></summary><div class="pa-body">';
      DATA.pointA.fields.forEach(function(f){
        if (S.pointA[f.id]) h += '<div class="pa-row"><span class="k">' + esc(f.label) + '</span>' +
                                 '<span class="v">' + esc(S.pointA[f.id]) + '</span></div>';
      });
      h += '</div></details>';
    }

    var pbFilled = S.pointB && Object.keys(S.pointB).length;
    h += '<div class="card"><div class="card-label">Точка Б</div>';
    if (pbFilled){
      h += '<p class="muted" style="margin-bottom:6px">Что изменилось за 30 дней.</p>';
      DATA.pointA.fields.forEach(function(f){
        var a = num(S.pointA[f.id]), b = num(S.pointB[f.id]);
        if (a === null && b === null) return;
        h += '<div class="pa-row"><span class="k">' + esc(f.label) + '</span>' +
             '<span class="v">' + fmtn(a) + ' → ' + fmtn(b) + delta(a,b) + '</span></div>';
      });
      h += '<button class="btn ghost sm" id="editB" style="margin-top:14px">Изменить цифры</button>';
    } else if (complete){
      h += '<p class="muted" style="margin-bottom:14px">' + esc(DATA.pointB.note) + '</p>' +
           '<button class="btn gold" id="fillB">Внести точку Б</button>';
    } else {
      h += '<p class="muted">' + esc(DATA.pointB.lockedNote) + '</p>';
    }
    h += '</div>';

    h += '<button class="btn ghost" id="report">Собрать отчёт по дням</button>' +
         '<div class="devbar"><button id="dev-next">тест: следующий день</button>' +
         '<button id="dev-reset">сбросить всё</button></div>';

    root.innerHTML = h;

    var pub = document.getElementById("publish");
    if (pub) pub.onclick = function(){ pickShot(day); };
    var pubNo = document.getElementById("publish-noshot");
    if (pubNo) pubNo.onclick = function(){ mark(day, null); };
    var add = document.getElementById("addshot");
    if (add) add.onclick = function(){ pickShot(day); };
    var prev = root.querySelector("[data-full]");
    if (prev) prev.onclick = function(){ openShot(day); };
    Array.prototype.forEach.call(root.querySelectorAll(".dot.done"), function(el){
      el.onclick = function(){ openShot(+el.getAttribute("data-day")); };
    });
    document.getElementById("report").onclick = renderReport;
    var fb = document.getElementById("fillB"); if (fb) fb.onclick = renderPointB;
    var eb = document.getElementById("editB"); if (eb) eb.onclick = renderPointB;
    document.getElementById("dev-next").onclick = function(){ S.offset = (S.offset||0)+1; save(); render(); window.scrollTo(0,0); };
    var rst = document.getElementById("dev-reset");
    rst.onclick = function(){
      if (rst.dataset.armed === "1"){
        try { localStorage.removeItem(STORE); } catch(e){}
        S = blank(); save(); render(); window.scrollTo(0,0);
        toast("Прогресс стёрт. Начинаем заново.");
        return;
      }
      rst.dataset.armed = "1";
      rst.textContent = "нажми ещё раз, чтобы стереть";
      rst.style.color = "var(--gold-deep)";
      rst.style.borderColor = "var(--gold)";
      clearTimeout(rst._t);
      rst._t = setTimeout(function(){
        rst.dataset.armed = "0";
        rst.textContent = "сбросить всё";
        rst.style.color = "";
        rst.style.borderColor = "";
      }, 4000);
    };
  }

  function renderPointB(){
    var h = '<div class="eyebrow"><span class="line"></span><span>точка б</span><span class="line"></span></div>' +
      '<h1 class="title">Где ты <em>сейчас</em></h1>' +
      '<p class="subtitle">' + esc(DATA.pointB.note) + '</p><div class="card">';
    DATA.pointA.fields.forEach(function(f){
      var was = S.pointA[f.id] ? " (было: " + esc(S.pointA[f.id]) + ")" : "";
      var val = (S.pointB && S.pointB[f.id]) ? esc(S.pointB[f.id]) : "";
      h += '<div class="field"><label for="pb-' + esc(f.id) + '">' + esc(f.label) + was + '</label>' +
           '<input id="pb-' + esc(f.id) + '" data-pb="' + esc(f.id) + '"' + inputAttrs(f) +
           ' value="' + val + '" placeholder="' + esc(f.placeholder) + '"></div>';
    });
    h += '</div><button class="btn" id="saveB">Сохранить точку Б</button>' +
         '<button class="btn ghost" id="backB" style="margin-top:10px">Назад</button>';
    root.innerHTML = h; window.scrollTo(0,0);
    document.getElementById("saveB").onclick = function(){
      var v = {};
      Array.prototype.forEach.call(root.querySelectorAll("[data-pb]"), function(i){
        if (i.value.trim()) v[i.getAttribute("data-pb")] = i.value.trim();
      });
      if (!Object.keys(v).length) return toast("Заполни хотя бы одно поле");
      S.pointB = v; save(); render(); window.scrollTo(0,0);
    };
    document.getElementById("backB").onclick = function(){ render(); window.scrollTo(0,0); };
  }

  function renderReport(){
    var tot = total(), items = "";
    for (var i=1;i<=tot;i++){
      var d = S.days[i]; if (!d) continue;
      var idea = ideaFor(i);
      items += '<div class="rep-item">' +
        (d.shot ? '<img src="' + d.shot + '" alt="День ' + i + '" data-open="' + i + '">'
                : '<div class="noimg">без скрина</div>') +
        '<div class="meta"><div class="d">День ' + i + ' · ' + fmt(d.date) + '</div>' +
        '<div class="t">' + esc(idea ? idea.title : "") + '</div></div></div>';
    }
    root.innerHTML =
      '<div class="eyebrow"><span class="line"></span><span>отчёт</span><span class="line"></span></div>' +
      '<h1 class="title">Что <em>вышло</em></h1>' +
      '<p class="subtitle">' + (items
        ? "Сделай скриншот этого экрана и пришли мне вместе с заявкой на соляр."
        : "Пока ни одного дня не отмечено. Вернись на главный экран и начни с сегодняшней идеи.") + '</p>' +
      (items ? '<div class="rep-grid">' + items + '</div>' : "") +
      '<button class="btn ghost" id="back" style="margin-top:18px">На главный экран</button>';
    Array.prototype.forEach.call(root.querySelectorAll("[data-open]"), function(el){
      el.onclick = function(){ openShot(+el.getAttribute("data-open")); };
    });
    document.getElementById("back").onclick = function(){ render(); window.scrollTo(0,0); };
    window.scrollTo(0,0);
  }

  function openShot(day){
    var d = S.days[day]; if (!d || !d.shot) return;
    document.getElementById("lightbox-img").src = d.shot;
    document.getElementById("lightbox").classList.add("show");
  }
  document.getElementById("lightbox").onclick = function(){ this.classList.remove("show"); };

  var picker = document.getElementById("picker");
  function pickShot(day){
    picker.value = "";
    picker.onchange = function(){
      var f = picker.files && picker.files[0];
      if (!f) return;
      shrink(f, function(url){ mark(day, url); });
    };
    picker.click();
  }
  function shrink(file, cb){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var k = Math.min(1, 420 / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.55));
      };
      img.onerror = function(){ cb(null); };
      img.src = reader.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }
  function mark(day, shot){
    S.days[day] = { date: new Date().toISOString(), shot: shot || null };
    if (!save()){
      S.days[day].shot = null; save();
      toast("Скрин не поместился в память телефона. День отмечен без него.");
    } else {
      toast(shot ? "День " + day + " закрыт. Скрин сохранён." : "День " + day + " закрыт.");
    }
    render(); window.scrollTo(0,0);
  }
})();
</script>
</body>
</html>
